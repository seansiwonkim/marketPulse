name: pipeline

# Fetches news from Finnhub, scores it with FinBERT and VADER, and saves it to the shared
# cloud database. Runs once a day, and on demand from the Actions tab ("Run workflow").
on:
  schedule:
    - cron: "30 22 * * *" # 22:30 UTC every day, after US markets close
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipeline
  cancel-in-progress: false # never kill a run half-way through writing

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Fail in seconds with a clear message, instead of after a 10-minute install.
      # A missing or misspelled secret reaches the job as an empty string.
      - name: Check secrets are set
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: |
          [ -n "$DATABASE_URL" ] || { echo "::error::The DATABASE_URL secret is empty or missing"; exit 1; }
          [ -n "$FINNHUB_API_KEY" ] || { echo "::error::The FINNHUB_API_KEY secret is empty or missing"; exit 1; }
          case "$DATABASE_URL" in
            postgres://* | postgresql://* | postgresql+psycopg://*) ;;
            *) echo "::error::DATABASE_URL must start with postgresql://"; exit 1 ;;
          esac

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      # CPU-only torch first: the default Linux wheel bundles gigabytes of unused CUDA libraries.
      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "./backend[ml]"

      # Keeps the ~440 MB FinBERT download between runs.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: finbert-v1

      - name: Fetch news and score it
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python -m app.workers.run_pipeline
