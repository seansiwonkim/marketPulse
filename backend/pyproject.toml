[project]
name = "marketpulse"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2",
    "alembic",
    "psycopg[binary]",
    "pydantic-settings",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
]

[tool.setuptools]
packages = [
    "app",
    "app.api",
    "app.core",
    "app.db",
    "app.models",
    "app.schemas",
    "app.services",
    "app.workers",
]

[tool.pytest.ini_options]
pythonpath = ["."]
